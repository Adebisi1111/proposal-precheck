services:
  - type: web
    name: proposal-precheck
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: CONTRACT_ADDRESS
        value: 0x746404bddc74954bb51303c11E35CA78543643E5
      - key: PRIVATE_KEY
        sync: false
    healthCheckPath: /api/health
