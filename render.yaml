services:
  - type: web
    name: proposal-precheck
    region: oregon
    plan: free
    # rm -rf first: node_modules was committed to this repo until e58c1e32.
    # With a populated tree already present npm skipped extracting
    # genlayer-js's ESM chunks, and every contract call failed at runtime.
    buildCommand: rm -rf node_modules && npm install
    startCommand: node server.js
    envVars:
      - key: CONTRACT_ADDRESS
        value: 0x51FaC52B4C9ebEeaDcBbd45c9142117E69e17204
      # genlayer-js 1.x does not export studioDevnet at all; 2.0.0-rc.1 does.
      - key: CHAIN_NAME
        value: studioDevnet
      - key: PRIVATE_KEY
        sync: false
    healthCheckPath: /api/health
