services:
  - type: web
    name: proposal-precheck
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CONTRACT_ADDRESS
        value: 0xE2cEFCC1C449dBD8BBa32858a09eD72738A6976c
      - key: PRIVATE_KEY
        sync: false
    healthCheckPath: /api/health
