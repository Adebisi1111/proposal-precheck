<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="400" fill="#0a0c10"/>

  <!-- mark: a seal ring with a check, cut by a digest notch -->
  <g transform="translate(150 200)">
    <circle r="86" fill="none" stroke="url(#ring)" stroke-width="11"/>
    <!-- three small ticks around the ring: the validator committee -->
    <g stroke="#0a0c10" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-97" x2="0" y2="-75"/>
      <line x1="84" y1="48"  x2="64"  y2="37"/>
      <line x1="-84" y1="48" x2="-64" y2="37"/>
    </g>
    <path d="M -38 2 L -12 28 L 42 -26"
          fill="none" stroke="#4ade80" stroke-width="17"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark: textLength pins the width so it cannot overrun the canvas -->
  <text x="278" y="192" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="72" font-weight="800" fill="#f5f7fa" letter-spacing="-2">precheck<tspan fill="#6b7280" font-weight="600">.dao</tspan></text>
  <text x="282" y="230" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="500" fill="#8b93a7" letter-spacing="1.4">AI PROPOSAL VALIDATION</text>

  <!-- the bound digest, rendered as a fingerprint -->
  <g transform="translate(282 268)">
    <rect x="0" y="0" width="424" height="42" rx="21"
          fill="none" stroke="#1f2937" stroke-width="1.5"/>
    <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#4ade80" letter-spacing="0.5">277d73f36607e24a</text>
    <text x="226" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#374151">…9dbd8b8</text>
  </g>

  <text x="282" y="350" font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="16" font-weight="500" fill="#4b5563" letter-spacing="0.4">Every verdict is bound to a SHA-256 of the text it judged</text>
</svg>